services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tamp
      POSTGRES_USER: tamp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamp -d tamp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tamp:${POSTGRES_PASSWORD}@postgres:5432/tamp
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build: .
    networks:
      - default
      - tamp
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tamp:${POSTGRES_PASSWORD}@postgres:5432/tamp
    volumes:
      - uploads:/app/storage/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tamp:${POSTGRES_PASSWORD}@postgres:5432/tamp
    command: ["python", "-m", "app.services.webhook_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:

networks:
  tamp:
    name: ${TAMP_NETWORK:-tamp-network}
